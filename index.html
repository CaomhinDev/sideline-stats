<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Log your team's match events from the sideline: tap the pitch, the event and the player. Data stays in your browser.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1b6e3a">
  <title>Sideline Stats</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="view" tabindex="-1"></main>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#/games" data-tab="games">Games</a>
    <a href="#/squad" data-tab="squad">Squad</a>
    <a href="#/data" data-tab="data">Data</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p id="dialog-error" class="field-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-quiet" id="dialog-cancel">Cancel</button>
        <button type="submit" class="btn" id="dialog-ok">OK</button>
      </div>
    </form>
  </dialog>

  <noscript><p class="banner">Sideline Stats needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
